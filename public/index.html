<!-- ============================================================
     ファイル: public/index.html
     バージョン: v2.2
     日付: 2026-06-12
     変更点:
       1) ルーレット＋操作ボタンを画面上部に固定(sticky)
          → 盤面を下にスクロールしても常に見える
       2) 電車コマを721系風デフォルメに作り替え
          （屋根・大窓多数・ドア・運転台・下部色帯・スカート・4輪／右向き）
       ※ 自動スクロール・iPhone音復活・リセット再接続は client.js v2.2 側
     ※ server.js v2.2 / client.js v2.2 とセットで使用
     ============================================================ -->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>みんなですごろく 〜栗山から小樽〜</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Hiragino Kaku Gothic ProN", "メイリオ", sans-serif;
      background: #eef3f8;
      color: #222;
      padding: 0 12px 12px;
    }
    h1 {
      font-size: 18px;
      text-align: center;
      margin: 8px 0;
      color: #1b3a5b;
    }

    /* ===== 上部固定エリア（ルーレット＋操作）===== */
    .stickyTop {
      position: sticky;
      top: 0;
      z-index: 20;
      background: #eef3f8;
      padding: 6px 0 8px;
      border-bottom: 2px solid #c9d6e4;
    }
    .topInner {
      max-width: 920px;
      margin: 0 auto;
      background: #fff;
      border-radius: 10px;
      padding: 8px 12px 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,.08);
    }
    .nameArea {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }
    #nameInput {
      flex: 1 1 160px;
      padding: 7px 10px;
      font-size: 16px;
      border: 1px solid #bbb;
      border-radius: 6px;
    }
    button {
      padding: 8px 14px;
      font-size: 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #2d6cb6;
      color: #fff;
    }
    button:hover { background: #245a99; }
    button:disabled { background: #9bb4cc; cursor: default; }
    #resetBtn { background: #c0562b; }
    #resetBtn:hover { background: #a3471f; }

    #status {
      font-size: 15px;
      font-weight: bold;
      margin: 4px 0;
      color: #1b3a5b;
      text-align: center;
    }
    #players { font-size: 13px; line-height: 1.7; text-align: center; }

    /* ===== ルーレット（固定エリア内・少し小さめ）===== */
    #rouletteWrap {
      position: relative;
      width: 180px;
      height: 196px;
      margin: 4px auto;
    }
    #pointer {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 11px solid transparent;
      border-right: 11px solid transparent;
      border-top: 18px solid #111;
      z-index: 5;
    }
    #wheel {
      display: block;
      width: 180px;       /* canvasは260のまま、表示だけ縮小 */
      height: 180px;
      margin: 14px auto 0;
      transition: transform 4s cubic-bezier(0.15, 0.85, 0.2, 1);
    }
    .btnRow { text-align: center; margin-top: 4px; }

    /* ===== 盤面：横幅に合わせて列数が自動で変わる ===== */
    #board {
      max-width: 1200px;
      margin: 10px auto 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 8px;
      padding: 4px;
    }

    .cell {
      background: #f7f7f7;
      border: 1px solid #cfcfcf;
      border-radius: 6px;
      padding: 6px 5px 5px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      position: relative;
    }
    .cell.start { background: #fff1ea; }
    .cell.goal  { background: #fff8e2; }

    .stTag {
      position: absolute;
      top: -8px;
      right: 6px;
      font-size: 10px;
      font-weight: bold;
      color: #fff;
      background: #c0562b;
      padding: 1px 6px;
      border-radius: 8px;
    }
    .cell.goal .stTag { background: #d4a017; }

    /* ===== 駅名標（高さ固定で揃える）===== */
    .stSign {
      background: #fff;
      border: 2px solid #2a6db0;
      border-radius: 5px;
      padding: 5px 4px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 62px;
      overflow: hidden;
    }
    .stKanji {
      font-size: 16px; font-weight: bold; color: #111;
      text-align: center; line-height: 1.15; word-break: break-all;
    }
    .stKana {
      font-size: 11px; color: #444; text-align: center;
      line-height: 1.25; margin-top: 2px; word-break: break-all;
    }
    .stBand {
      width: 100%; background: #8cc63f; border-radius: 3px;
      margin-top: auto; padding: 2px 2px 3px;
    }
    .stRomaji {
      font-size: 10px; letter-spacing: .3px; color: #fff;
      text-align: center; line-height: 1.2; word-break: break-all;
    }
    .cell.longName .stKanji { font-size: 11px; line-height: 1.1; white-space: nowrap; }
    .cell.longName .stKana  { font-size: 8.5px; line-height: 1.1; white-space: nowrap; }
    .cell.longName .stRomaji{ font-size: 8px; white-space: nowrap; }

    /* ===== 電車スペース ===== */
    .pawns {
      min-height: 40px; margin-top: 5px;
      display: flex; flex-direction: row; flex-wrap: wrap;
      gap: 4px; justify-content: center; align-items: flex-start;
    }
    .pawnWrap {
      display: flex; flex-direction: column; align-items: center; width: 56px;
    }
    .pawnName {
      font-size: 9px; color: #333; text-align: center; line-height: 1.1;
      margin-top: 1px; max-width: 56px; overflow: hidden;
      white-space: nowrap; text-overflow: ellipsis;
    }

    /* ===== 電車コマ：JR北海道721系風（右向き）===== */
    .train { position: relative; width: 54px; height: 26px; }
    /* 車体（銀色ステンレス）。右端=先頭を少しだけ角丸に */
    .train .trainBody {
      position: relative;
      width: 54px; height: 18px;
      background: linear-gradient(#fbfcfd, #d7dce0 60%, #c2c8cd);
      border: 1px solid #8a9097;
      border-radius: 3px 5px 3px 3px;
      overflow: hidden;
    }
    /* 屋根（上の濃いめのライン）*/
    .train .trainRoof {
      position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: #9aa1a8;
    }
    /* 窓・ドアの並び（横一列）*/
    .train .trainWindows {
      position: absolute; top: 4px; left: 3px; right: 3px;
      display: flex; gap: 1.5px; align-items: center;
    }
    .train .trainWindows span {
      flex: 1; height: 7px;
      background: #cfe9ff; border: 1px solid #a9cae6; border-radius: 1px;
    }
    .train .trainWindows .door {
      flex: 0 0 4px; height: 9px;
      background: #b9c3cc; border: 1px solid #97a2ab; border-radius: 1px;
    }
    .train .trainWindows .cab {  /* 右端＝運転台の前面窓 */
      flex: 0 0 6px; height: 7px;
      background: #bfe0ff; border: 1px solid #9cc0e0;
      border-radius: 1px 3px 1px 1px;
    }
    /* プレイヤー色の帯（車体下部）*/
    .train .trainBand {
      position: absolute; left: 0; right: 0; bottom: 2px; height: 3px;
      background: var(--bandColor, #2ecc71);
    }
    /* 床下スカート */
    .train .trainSkirt {
      width: 50px; height: 3px; margin: 0 auto;
      background: #6f767c; border-radius: 0 0 2px 2px;
    }
    /* 車輪（4つ）*/
    .train .trainWheels {
      position: absolute; bottom: 0; left: 6px; right: 6px;
      display: flex; justify-content: space-between;
    }
    .train .trainWheels i {
      display: block; width: 5px; height: 5px;
      background: #333; border-radius: 50%; border: 1px solid #666;
    }

    /* ===== 結果表示 ===== */
    #result {
      max-width: 920px; margin: 14px auto;
      background: #fff; border-radius: 10px; padding: 12px;
      font-size: 15px; line-height: 1.9;
      box-shadow: 0 2px 6px rgba(0,0,0,.08); display: none;
    }
    #result.show { display: block; }
    #result h2 { margin: 0 0 8px; font-size: 18px; color: #1b3a5b; }
  </style>
</head>
<body>
  <h1>みんなですごろく 〜栗山から小樽〜</h1>

  <!-- 上部固定エリア -->
  <div class="stickyTop">
    <div class="topInner">
      <div class="nameArea" id="nameArea">
        <input id="nameInput" type="text" maxlength="12" placeholder="名前を入力" />
        <button id="nameBtn">名前を決定</button>
      </div>
      <div id="status">接続中...</div>
      <div id="players"></div>

      <div id="rouletteWrap">
        <div id="pointer"></div>
        <canvas id="wheel" width="260" height="260"></canvas>
      </div>

      <div class="btnRow">
        <button id="startBtn">ゲーム開始</button>
        <button id="rollBtn">ルーレットを回す</button>
        <button id="resetBtn">リセット</button>
      </div>
    </div>
  </div>

  <div id="board"></div>

  <div id="result"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/client.js"></script>
</body>
</html>
