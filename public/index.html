<!-- ============================================================
     ファイル: public/index.html
     バージョン: v1.9
     日付: 2026-06-12
     変更点:
       1) 長い駅名（.longName 例:サッポロビール庭園）の
          漢字・ひらがなを小さくして1段に収める
       2) 電車コマをJR北海道721系風のデフォルメに変更
          （銀色ステンレス車体＋プレイヤー色の帯／進行方向＝右向き）
       ※ 名前決定音は client.js v1.9 側で対応済み
     v1.8: 表示崩れ修正・横幅自動列数・リセット常時・満員詰まり解消
     ※ server.js v1.9(=v1.8と同一) / client.js v1.9 とセットで使用
     ============================================================ -->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>みんなですごろく 〜栗山から小樽〜</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Hiragino Kaku Gothic ProN", "メイリオ", sans-serif;
      background: #eef3f8;
      color: #222;
      padding: 12px;
    }
    h1 {
      font-size: 20px;
      text-align: center;
      margin: 6px 0 12px;
      color: #1b3a5b;
    }

    /* ===== 上部のコントロール ===== */
    .topArea {
      max-width: 920px;
      margin: 0 auto 12px;
      background: #fff;
      border-radius: 10px;
      padding: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,.08);
    }
    .nameArea {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    #nameInput {
      flex: 1 1 160px;
      padding: 8px 10px;
      font-size: 16px;
      border: 1px solid #bbb;
      border-radius: 6px;
    }
    button {
      padding: 9px 16px;
      font-size: 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #2d6cb6;
      color: #fff;
    }
    button:hover { background: #245a99; }
    button:disabled { background: #9bb4cc; cursor: default; }
    #resetBtn { background: #c0562b; }
    #resetBtn:hover { background: #a3471f; }

    #status {
      font-size: 16px;
      font-weight: bold;
      margin: 6px 0;
      color: #1b3a5b;
    }
    #players { font-size: 14px; line-height: 1.9; }

    /* ===== ルーレット ===== */
    #rouletteWrap {
      position: relative;
      width: 260px;
      height: 280px;
      margin: 10px auto;
    }
    #pointer {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 22px solid #111;
      z-index: 5;
    }
    #wheel {
      display: block;
      margin: 18px auto 0;
      transition: transform 4s cubic-bezier(0.15, 0.85, 0.2, 1);
    }

    /* ===== 盤面：横幅に合わせて列数が自動で変わる ===== */
    #board {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 8px;
      padding: 4px;
    }

    /* ===== 1マス（駅）===== */
    .cell {
      background: #f7f7f7;
      border: 1px solid #cfcfcf;
      border-radius: 6px;
      padding: 6px 5px 5px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      position: relative;
    }
    .cell.start { background: #fff1ea; }
    .cell.goal  { background: #fff8e2; }

    .stTag {
      position: absolute;
      top: -8px;
      right: 6px;
      font-size: 10px;
      font-weight: bold;
      color: #fff;
      background: #c0562b;
      padding: 1px 6px;
      border-radius: 8px;
    }
    .cell.goal .stTag { background: #d4a017; }

    /* ===== 駅名標（看板）風 ===== */
    .stSign {
      background: #fff;
      border: 2px solid #2a6db0;
      border-radius: 5px;
      padding: 5px 4px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .stKanji {
      font-size: 16px;
      font-weight: bold;
      color: #111;
      text-align: center;
      line-height: 1.15;
      word-break: break-all;
    }
    .stKana {
      font-size: 11px;
      color: #444;
      text-align: center;
      line-height: 1.25;
      margin-top: 2px;
      word-break: break-all;
    }
    .stBand {
      width: 100%;
      background: #8cc63f;
      border-radius: 3px;
      margin-top: 4px;
      padding: 2px 2px 3px;
    }
    .stRomaji {
      font-size: 10px;
      letter-spacing: .3px;
      color: #fff;
      text-align: center;
      line-height: 1.2;
      word-break: break-all;
    }

    /* ===== 長い駅名は文字を小さくして1段に収める ===== */
    .cell.longName .stKanji {
      font-size: 11px;
      line-height: 1.1;
      white-space: nowrap;   /* 1段に収める */
    }
    .cell.longName .stKana {
      font-size: 8.5px;
      line-height: 1.1;
      white-space: nowrap;   /* 1段に収める */
    }
    .cell.longName .stRomaji {
      font-size: 8px;
      white-space: nowrap;
    }

    /* ===== 電車専用スペース ===== */
    .pawns {
      min-height: 36px;
      margin-top: 5px;
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 4px;
      justify-content: center;
      align-items: flex-start;
    }
    .pawnWrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 44px;
    }
    .pawnName {
      font-size: 9px;
      color: #333;
      text-align: center;
      line-height: 1.1;
      margin-top: 1px;
      max-width: 44px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    /* ===== 電車コマ：JR北海道721系風デフォルメ（右向き）===== */
    .train {
      position: relative;
      width: 42px;
      height: 24px;
    }
    /* 銀色（ステンレス）の車体。右側を少し丸めて先頭=進行方向に */
    .train .trainBody {
      position: relative;
      width: 42px;
      height: 17px;
      background: linear-gradient(#f4f6f8, #cdd3d8 55%, #aeb4ba);
      border: 1px solid #8a9097;
      border-radius: 4px 9px 4px 4px;
      overflow: hidden;
    }
    /* 窓（上の方に並ぶ）*/
    .train .trainWindows {
      position: absolute;
      top: 3px;
      left: 5px;
      display: flex;
      gap: 2px;
      z-index: 2;
    }
    .train .trainWindows span {
      display: block;
      width: 6px;
      height: 5px;
      background: #d4ecff;
      border: 1px solid #aacbe6;
      border-radius: 1px;
    }
    /* プレイヤー色の帯（窓の下に1本）*/
    .train .trainBand {
      position: absolute;
      left: 0; right: 0;
      top: 11px;
      height: 3px;
      background: var(--bandColor, #2ecc71);
      z-index: 1;
    }
    /* 先頭（右）の前面ガラス */
    .train .trainNose {
      position: absolute;
      right: 2px;
      top: 2px;
      width: 6px;
      height: 6px;
      background: #cfe8ff;
      border: 1px solid #aacbe6;
      border-radius: 1px 4px 1px 1px;
      z-index: 2;
    }
    /* 先頭のライト */
    .train .trainLight {
      position: absolute;
      right: 3px;
      bottom: 2px;
      width: 3px;
      height: 3px;
      background: #fff3b0;
      border-radius: 50%;
      z-index: 2;
    }
    .train .trainWheels {
      position: absolute;
      bottom: 0;
      left: 5px;
      right: 5px;
      display: flex;
      justify-content: space-between;
    }
    .train .trainWheels i {
      display: block;
      width: 6px;
      height: 6px;
      background: #333;
      border-radius: 50%;
      border: 1px solid #666;
    }

    /* ===== 結果表示 ===== */
    #result {
      max-width: 920px;
      margin: 14px auto;
      background: #fff;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
      line-height: 1.9;
      box-shadow: 0 2px 6px rgba(0,0,0,.08);
      display: none;
    }
    #result.show { display: block; }
    #result h2 { margin: 0 0 8px; font-size: 18px; color: #1b3a5b; }
  </style>
</head>
<body>
  <h1>みんなですごろく 〜栗山から小樽〜</h1>

  <div class="topArea">
    <div class="nameArea" id="nameArea">
      <input id="nameInput" type="text" maxlength="12" placeholder="名前を入力" />
      <button id="nameBtn">名前を決定</button>
    </div>
    <div id="status">接続中...</div>
    <div id="players"></div>

    <div id="rouletteWrap">
      <div id="pointer"></div>
      <canvas id="wheel" width="260" height="260"></canvas>
    </div>

    <div style="text-align:center; margin-top:8px;">
      <button id="startBtn">ゲーム開始</button>
      <button id="rollBtn">ルーレットを回す</button>
      <button id="resetBtn">もう一度遊ぶ</button>
    </div>
  </div>

  <div id="board"></div>

  <div id="result"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/client.js"></script>
</body>
</html>
