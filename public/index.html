<!-- ============================================================
     ファイル: public/index.html
     バージョン: v1.7
     日付: 2026-06-12
     変更点:
       1) 駅の並びを画面の横幅に合わせて自動で列数を変える
          （広い画面は1段に多く、スマホは少なく自動調整）
       2) 駅名標は「漢字→ひらがな→ローマ字帯」の順で固定
       3) 駅名標の下に電車専用スペースを必ず確保し、
          電車の有無でレイアウトが崩れないようにした
       4) リセットボタンはゲーム終了後のみ表示
     ※ server.js v1.7 / client.js v1.7 とセットで使用
     ============================================================ -->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>みんなですごろく 〜栗山から小樽〜</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Hiragino Kaku Gothic ProN", "メイリオ", sans-serif;
      background: #eef3f8;
      color: #222;
      padding: 12px;
    }
    h1 {
      font-size: 20px;
      text-align: center;
      margin: 6px 0 12px;
      color: #1b3a5b;
    }

    /* ===== 上部のコントロール ===== */
    .topArea {
      max-width: 920px;
      margin: 0 auto 12px;
      background: #fff;
      border-radius: 10px;
      padding: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,.08);
    }
    .nameArea {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    #nameInput {
      flex: 1 1 160px;
      padding: 8px 10px;
      font-size: 16px;
      border: 1px solid #bbb;
      border-radius: 6px;
    }
    button {
      padding: 9px 16px;
      font-size: 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #2d6cb6;
      color: #fff;
    }
    button:hover { background: #245a99; }
    button:disabled { background: #9bb4cc; cursor: default; }
    #resetBtn { background: #c0562b; }
    #resetBtn:hover { background: #a3471f; }

    #status {
      font-size: 16px;
      font-weight: bold;
      margin: 6px 0;
      color: #1b3a5b;
    }
    #players {
      font-size: 14px;
      line-height: 1.7;
    }

    /* ===== ルーレット ===== */
    #rouletteWrap {
      position: relative;
      width: 260px;
      height: 280px;
      margin: 10px auto;
    }
    #pointer {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 22px solid #111;
      z-index: 5;
    }
    #wheel {
      display: block;
      margin: 18px auto 0;
      transition: transform 4s cubic-bezier(0.15, 0.85, 0.2, 1);
    }

    /* ===== 盤面 ===== */
    #board {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      /* 横幅に合わせて自動で列数が変わる（1マス最小150px） */
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 8px;
      padding: 4px;
    }

    /* ===== 駅名標（看板）風セル ===== */
    .cell {
      background: #fff;
      border: 2px solid #3a7d3a;
      border-radius: 6px;
      padding: 6px 4px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 110px;
      position: relative;
    }
    .cell.start { border-color: #c0562b; }
    .cell.goal  { border-color: #d4a017; }

    .cellKanji {
      font-size: 17px;
      font-weight: bold;
      color: #111;
      text-align: center;
      line-height: 1.1;
      white-space: nowrap;
    }
    .cellKana {
      font-size: 12px;
      color: #333;
      text-align: center;
      line-height: 1.2;
      margin-top: 2px;
      /* 長い読みは2段で折り返す */
      white-space: normal;
      word-break: break-all;
    }
    .cellRomaji {
      margin-top: 4px;
      width: 100%;
      background: #8cc63f;        /* 黄緑の帯 */
      color: #fff;
      font-size: 11px;
      letter-spacing: .5px;
      text-align: center;
      border-radius: 3px;
      padding: 2px 0;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
    }

    /* 電車専用スペース：駅名標の下に必ず確保（電車の有無に関係なく一定の高さ） */
    .pawnWrap {
      width: 100%;
      min-height: 30px;
      margin-top: 5px;
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 3px;
      justify-content: center;
      align-items: center;
    }

    /* ===== 結果表示 ===== */
    #result {
      max-width: 920px;
      margin: 14px auto;
      background: #fff;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
      line-height: 1.8;
      box-shadow: 0 2px 6px rgba(0,0,0,.08);
      display: none;
    }
    #result.show { display: block; }
    #result h2 { margin: 0 0 8px; font-size: 18px; color: #1b3a5b; }
  </style>
</head>
<body>
  <h1>みんなですごろく 〜栗山から小樽〜</h1>

  <div class="topArea">
    <div class="nameArea">
      <input id="nameInput" type="text" maxlength="12" placeholder="名前を入力" />
      <button id="nameBtn">名前を決定</button>
    </div>
    <div id="status">接続中...</div>
    <div id="players"></div>

    <div id="rouletteWrap">
      <div id="pointer"></div>
      <canvas id="wheel" width="260" height="260"></canvas>
    </div>

    <div style="text-align:center; margin-top:8px;">
      <button id="startBtn">ゲーム開始</button>
      <button id="rollBtn">ルーレットを回す</button>
      <button id="resetBtn" style="display:none;">もう一度遊ぶ</button>
    </div>
  </div>

  <div id="board"></div>

  <div id="result"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/client.js"></script>
</body>
</html>
