         絶対配置(position:absolute, left/right/bottom=0)で隙間をなくした
       - 721系コマをCSSで精密化（デフォルメを抑え、緑ライン2本・窓配置・
         台車・スカートを実車寄りに）。コマを少し大きく表示

     v3.4.0: 「ルーレットを回す」ボタンを廃止（本体クリックで回す）

<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>みんなですごろく 〜栗山から小樽〜</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Hiragino Kaku Gothic ProN", "メイリオ", sans-serif;
      background: #eef3f8;
      color: #222;
      padding: 0 12px 24px;
    }

    h1 {
      font-size: 18px;
      text-align: center;
      margin: 10px 0;
      color: #1b3a5b;
    }

    button {
      padding: 8px 14px;
      font-size: 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #2d6cb6;
      color: #fff;
    }

    button:hover {
      background: #245a99;
    }

    button:disabled {
      background: #9bb4cc;
      cursor: default;
    }

    #resetBtn {
      background: #c0562b;
    }

    #resetBtn:hover {
      background: #a3471f;
    }

    /* ===== ルーレット＋操作：画面左上に固定 ===== */
    .fixedPanel {
      position: fixed;
      top: 10px;
      left: 10px;
      width: 320px;
      max-height: calc(100vh - 20px);
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.97);
      border: 2px solid #c9d6e4;
      border-radius: 14px;
      padding: 10px 14px 12px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .18);
      text-align: center;
      z-index: 100;
    }

    .nameArea {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 6px;
    }

    #nameInput {
      flex: 1 1 140px;
      padding: 7px 10px;
      font-size: 15px;
      border: 1px solid #bbb;
      border-radius: 6px;
    }

    #routeArea {
      margin-bottom: 6px;
    }

    #routeLabel {
      font-size: 13px;
      font-weight: bold;
      color: #1b3a5b;
      margin-bottom: 4px;
    }

    .routeBtn {
      background: #fff;
      color: #1f8b5c;
      border: 2px solid #1f8b5c;
      margin: 0 3px;
      padding: 6px 10px;
    }

    .routeBtn:hover {
      background: #eafaf0;
    }

    .routeBtn.selected {
      background: #1f8b5c;
      color: #fff;
    }

    #rouletteWrap {
      position: relative;
      width: 160px;
      height: 174px;
      margin: 6px auto 2px;
    }

    #pointer {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-top: 16px solid #111;
      z-index: 5;
    }

    #wheel {
      display: block;
      width: 160px;
      height: 160px;
      margin: 12px auto 0;
      transition: transform 4s cubic-bezier(0.15, 0.85, 0.2, 1);
    }

    #status {
      font-size: 14px;
      font-weight: bold;
      margin: 4px 0;
      color: #1b3a5b;
    }

    #players {
      font-size: 12px;
      line-height: 1.6;
    }

    .btnRow {
      margin-top: 6px;
    }

    .btnRow button {
      margin: 2px;
    }

    /* ===== ループ盤面（縦横スクロール可能なビューポート）===== */
    .boardScroll {
      width: 100%;
      height: 88vh;
      overflow: auto;
      padding: 0;
      scroll-behavior: smooth;
    }

    #board {
      position: relative;
      display: grid;
      grid-auto-columns: 120px;
      /* 駅セル幅80%（150→120） */
      grid-auto-rows: minmax(118px, auto);
      gap: 8px;
      width: max-content;
      padding: 50vh 50vw;
      /* どの駅も中央に来られる余白 */
    }

    /* ===== 駅セル（看板は角丸なしの長方形）===== */
    .cell {
      background: #f7f7f7;
      border: 1px solid #cfcfcf;
      border-radius: 6px;
      padding: 6px 5px 5px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      position: relative;
    }

    .cell.start {
      background: #fff1ea;
    }

    .cell.goal {
      background: #fff8e2;
    }

    .stTag {
      position: absolute;
      top: -8px;
      right: 6px;
      font-size: 10px;
      font-weight: bold;
      color: #fff;
      background: #c0562b;
      padding: 1px 6px;
      border-radius: 8px;
    }

    .cell.goal .stTag {
      background: #d4a017;
    }

    /* 青枠：角丸なしの長方形。緑帯を内側いっぱいに貼るため position:relative */
    .stSign {
      position: relative;
      background: #fff;
      border: 3px solid #1a7fc4;
      border-radius: 0;
      padding: 5px 4px 22px;
      /* 下に緑帯ぶんの余白を確保 */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 62px;
      overflow: hidden;
    }

    .stKanji {
      font-size: 16px;
      font-weight: bold;
      color: #111;
      text-align: center;
      line-height: 1.15;
      word-break: break-all;
    }

    .stKana {
      font-size: 11px;
      color: #444;
      text-align: center;
      line-height: 1.25;
      margin-top: 2px;
      word-break: break-all;
    }

    /* 緑帯：青枠の内側いっぱい（左右・下端まで密着）に絶対配置 */
    .stBand {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      background: #8cc63f;
      border-radius: 0;
      padding: 2px 2px 3px;
    }

    .stRomaji {
      font-size: 10px;
      letter-spacing: .3px;
      color: #fff;
      text-align: center;
      line-height: 1.2;
      word-break: break-all;
    }

    .cell.longName .stKanji {
      font-size: 11px;
      line-height: 1.1;
      white-space: nowrap;
    }

    .cell.longName .stKana {
      font-size: 8.5px;
      line-height: 1.1;
      white-space: nowrap;
    }

    .cell.longName .stRomaji {
      font-size: 8px;
      white-space: nowrap;
    }

    .pawns {
      min-height: 46px;
      margin-top: 5px;
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 4px;
      justify-content: center;
      align-items: flex-start;
    }

    .pawnWrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 74px;
    }

    .pawnName {
      font-size: 9px;
      color: #333;
      text-align: center;
      line-height: 1.1;
      margin-top: 1px;
      max-width: 74px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    /* ===== 721系電車コマ（精密版）/ .flipで左向き ===== */
    .train {
      position: relative;
      width: 72px;
      height: 34px;
    }

    .train.flip {
      transform: scaleX(-1);
    }

    /* 車体：銀色のグラデーション */
    .train .trainBody {
      position: relative;
      width: 72px;
      height: 24px;
      background: linear-gradient(#ffffff 0%, #eceff1 35%, #c7ced3 70%, #aeb6bc 100%);
      border: 1px solid #7d858c;
      border-radius: 4px 6px 3px 3px;
      overflow: hidden;
    }

    /* 屋根の濃いライン */
    .train .trainRoof {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: #aab0b5;
    }

    /* 上部の細い緑ライン */
    .train .lineThin {
      position: absolute;
      top: 8px;
      left: 0;
      right: 0;
      height: 1.5px;
      background: #36a94a;
      opacity: .9;
    }

    /* 窓下の太い緑帯 */
    .train .lineThick {
      position: absolute;
      bottom: 5px;
      left: 0;
      right: 0;
      height: 3px;
      background: #2f9e45;
    }

    /* 窓列（乗務員窓・ドア・客窓） */
    .train .trainWindows {
      position: absolute;
      top: 3.5px;
      left: 3px;
      right: 3px;
      height: 8px;
      display: flex;
      gap: 1.5px;
      align-items: center;
    }

    .train .trainWindows span {
      flex: 1;
      height: 8px;
      background: linear-gradient(#dff0ff, #bcdcf5);
      border: 1px solid #9cc0e0;
      border-radius: 1px;
    }

    .train .trainWindows .door {
      flex: 0 0 5px;
      height: 9px;
      background: #c3ccd3;
      border: 1px solid #98a2aa;
      border-radius: 1px;
    }

    .train .trainWindows .cab {
      flex: 0 0 7px;
      height: 8px;
      background: linear-gradient(#cfe6ff, #a9cdee);
      border: 1px solid #8fb6da;
      border-radius: 1px 4px 1px 1px;
    }

    /* スカート（排障器） */
    .train .trainSkirt {
      width: 66px;
      height: 3px;
      margin: 0 auto;
      background: #6b7278;
      border-radius: 0 0 2px 2px;
    }

    /* 台車 */
    .train .trainWheels {
      position: absolute;
      bottom: 0;
      left: 8px;
      right: 8px;
      display: flex;
      justify-content: space-between;
    }

    .train .bogie {
      position: relative;
      width: 18px;
      height: 7px;
      background: #3b4146;
      border-radius: 2px;
    }

    .train .bogie i {
      position: absolute;
      bottom: -2px;
      width: 5px;
      height: 5px;
      background: #222;
      border: 1px solid #555;
      border-radius: 50%;
    }

    .train .bogie i.w1 {
      left: 1px;
    }

    .train .bogie i.w2 {
      right: 1px;
    }

    /* プレイヤー色の識別ドット（屋根上に小さく） */
    .train .colorDot {
      position: absolute;
      top: -3px;
      left: 50%;
      transform: translateX(-50%);
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--bandColor, #2ecc71);
      border: 1px solid #fff;
      box-shadow: 0 0 2px rgba(0, 0, 0, .4);
    }

    /* 結果 */
    #result {
      max-width: 920px;
      margin: 14px auto;
      background: #fff;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
      line-height: 1.9;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .08);
      display: none;
    }

    #result.show {
      display: block;
    }

    #result h2 {
      margin: 0 0 8px;
      font-size: 18px;
      color: #1b3a5b;
    }
  </style>
</head>

<body>
  <h1>みんなですごろく 〜栗山から小樽〜</h1>

  <!-- 画面左上に固定するパネル -->
  <div class="fixedPanel">
    <div class="nameArea" id="nameArea">
      <input id="nameInput" type="text" maxlength="12" placeholder="名前を入力" />
      <button id="nameBtn">名前を決定</button>
    </div>

    <div id="routeArea">
      <div id="routeLabel">あなたのルート：</div>
      <button id="routeOiwakeBtn" class="routeBtn">追分経由</button>
      <button id="routeIwamizawaBtn" class="routeBtn">岩見沢経由</button>
    </div>

    <div id="rouletteWrap">
      <div id="pointer"></div>
      <canvas id="wheel" width="260" height="260"></canvas>
    </div>

    <div id="status">接続中...</div>
    <div id="players"></div>

    <div class="btnRow">
      <button id="startBtn">ゲーム開始</button>
      <button id="resetBtn">リセット</button>
    </div>
  </div>

  <div class="boardScroll">
    <div id="board">
      <!-- 駅セルは client.js が gridRow/gridColumn 指定で配置 -->
    </div>
  </div>

  <div id="result"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/client.js"></script>
</body>

</html>
