<!-- =========================================================
     すごろくゲーム  public/index.html
     バージョン: v3.0
     日付: 2026-06-12
     v3.0での変更点:
       - ルート選択UI（追分経由 / 岩見沢経由）のボタンを設置
       - 選択中ルートを .selected で強調表示
       - 駅名標(.stSign)の高さを全駅で統一（longNameも同じ高さ）
       - 721系風電車コマCSS・ルーレット上部固定・自動スクロール対応(v2.2維持)
     ※ server.js v3.0 / client.js v3.0 とセットで使うこと
     ========================================================= -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>北海道すごろく</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    background: #eef3f7;
    color: #222;
  }

  /* ===== 上部固定エリア（ルーレット・操作） ===== */
  .topFixed {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #ffffff;
    border-bottom: 2px solid #cdd8e0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    padding: 10px 12px 12px;
    text-align: center;
  }
  h1 {
    margin: 4px 0 8px;
    font-size: 20px;
    color: #1f5c8b;
  }

  /* 名前・ルート選択 */
  .setupRow {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  #nameInput {
    padding: 8px 10px;
    font-size: 15px;
    border: 2px solid #aac3d6;
    border-radius: 8px;
    width: 150px;
  }
  #routeArea {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  #routeLabel {
    font-size: 14px;
    font-weight: bold;
    color: #1f5c8b;
    width: 100%;
  }
  .routeBtn {
    padding: 8px 12px;
    font-size: 14px;
    border: 2px solid #1f8b5c;
    background: #fff;
    color: #1f8b5c;
    border-radius: 8px;
    cursor: pointer;
  }
  .routeBtn.selected {
    background: #1f8b5c;
    color: #fff;
    box-shadow: 0 0 0 3px rgba(31,139,92,0.25);
  }

  /* ボタン */
  button {
    font-family: inherit;
  }
  .btn {
    padding: 8px 14px;
    font-size: 15px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    color: #fff;
  }
  #nameBtn { background: #e8731c; }
  #startBtn { background: #1f5c8b; }
  #rollBtn { background: #e6007e; font-weight: bold; }
  #resetBtn { background: #888; }
  .btn:disabled { opacity: 0.45; cursor: default; }

  .controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-bottom: 8px;
  }

  /* ルーレット */
  .wheelWrap {
    position: relative;
    width: 200px;
    height: 200px;
    margin: 4px auto 6px;
  }
  #wheel {
    width: 200px;
    height: 200px;
    transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
  }
  .wheelWrap::before {
    content: "";
    position: absolute;
    top: -6px;
    left: 50%;
    transform: translateX(-50%);
    border-left: 12px solid transparent;
    border-right: 12px solid transparent;
    border-top: 20px solid #e6007e;
    z-index: 5;
  }

  #status {
    font-size: 14px;
    font-weight: bold;
    color: #333;
    min-height: 20px;
  }
  #players {
    font-size: 13px;
    margin-top: 4px;
    color: #444;
  }

  /* ===== 盤面 ===== */
  #board {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 8px;
    padding: 12px;
    max-width: 1100px;
    margin: 0 auto;
  }

  .cell {
    background: #fff;
    border: 2px solid #cdd8e0;
    border-radius: 10px;
    padding: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    min-height: 150px;
  }
  .cell.start { border-color: #1f8b5c; }
  .cell.goal  { border-color: #e6007e; }

  /* 駅名標：高さを全駅で固定（longName も同じ高さ） */
  .stSign {
    width: 100%;
    height: 62px;
    border: 2px solid #1f5c8b;
    border-radius: 6px;
    background: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 2px;
  }
  .stKanji {
    font-size: 17px;
    font-weight: bold;
    color: #1f5c8b;
    line-height: 1.1;
    white-space: nowrap;
  }
  .stKana {
    font-size: 11px;
    color: #555;
    line-height: 1.1;
    white-space: nowrap;
  }
  .stBand {
    margin-top: 2px;
    width: 100%;
    background: #1f5c8b;
    border-radius: 3px;
  }
  .stRomaji {
    font-size: 9px;
    color: #fff;
    text-align: center;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* 長い駅名（サッポロビール庭園など）は文字を縮めて1段に収める */
  .cell.longName .stKanji { font-size: 12px; }
  .cell.longName .stKana  { font-size: 9px; }
  .cell.longName .stRomaji { font-size: 8px; }

  .stTag {
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    font-weight: bold;
    color: #fff;
    padding: 1px 8px;
    border-radius: 8px;
    white-space: nowrap;
  }
  .cell.start .stTag { background: #1f8b5c; }
  .cell.goal  .stTag { background: #e6007e; }

  /* 電車専用スペース（高さ固定で崩れ防止） */
  .pawns {
    width: 100%;
    min-height: 56px;
    margin-top: 6px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    justify-content: center;
    align-items: flex-end;
  }

  /* ===== 721系風 電車コマ（右向き） ===== */
  .pawnWrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 56px;
  }
  .train {
    --bandColor: #e74c3c;
    position: relative;
    width: 52px;
    height: 26px;
  }
  .trainBody {
    position: relative;
    width: 52px;
    height: 20px;
    background: linear-gradient(#f2f4f6, #c7ccd1);
    border: 1px solid #9aa2a8;
    /* 進行方向（右）の先頭を少し丸める */
    border-radius: 4px 9px 4px 4px;
    overflow: hidden;
  }
  .trainRoof {
    position: absolute;
    top: 0;
    left: 3px;
    right: 3px;
    height: 4px;
    background: #aeb6bc;
    border-radius: 4px 6px 0 0;
  }
  .trainWindows {
    position: absolute;
    top: 6px;
    left: 4px;
    right: 6px;
    height: 8px;
    display: flex;
    gap: 1.5px;
    align-items: center;
  }
  .trainWindows span {
    flex: 1;
    height: 8px;
    background: #2b6da8;
    border-radius: 1px;
  }
  .trainWindows .door {
    background: #4a86bd;
    flex: 0.7;
  }
  .trainWindows .cab {
    flex: 0.9;
    background: #1a4e7a;
    border-radius: 1px 5px 5px 1px; /* 先頭運転台 */
  }
  /* 車体下部のカラー帯（プレイヤー色） */
  .trainBand {
    position: absolute;
    bottom: 1px;
    left: 2px;
    right: 2px;
    height: 4px;
    background: var(--bandColor);
    border-radius: 2px;
  }
  .trainSkirt {
    position: absolute;
    bottom: 4px;
    left: 6px;
    right: 6px;
    height: 3px;
    background: #6b7178;
    border-radius: 1px;
  }
  .trainWheels {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 52px;
    display: flex;
    justify-content: space-around;
    padding: 0 6px;
  }
  .trainWheels i {
    width: 5px;
    height: 5px;
    background: #333;
    border-radius: 50%;
    display: block;
  }
  .pawnName {
    font-size: 9px;
    color: #333;
    line-height: 1.1;
    margin-top: 1px;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 56px;
  }

  /* ===== 結果表示 ===== */
  #result {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #fff;
    border: 3px solid #e6007e;
    border-radius: 14px;
    padding: 20px 30px;
    text-align: center;
    font-size: 18px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    z-index: 200;
    line-height: 1.8;
  }
  #result.show { display: block; }
  #result h2 { margin: 0 0 10px; color: #e6007e; }
</style>
</head>
<body>

  <div class="topFixed">
    <h1>北海道すごろく</h1>

    <div class="setupRow">
      <input id="nameInput" type="text" placeholder="名前を入力" maxlength="8" />
      <button id="nameBtn" class="btn">名前を決定</button>
    </div>

    <div id="routeArea">
      <div id="routeLabel">ルート：</div>
      <button id="routeOiwakeBtn" class="routeBtn">追分経由ルート</button>
      <button id="routeIwamizawaBtn" class="routeBtn">岩見沢経由ルート</button>
    </div>

    <div class="wheelWrap">
      <canvas id="wheel" width="200" height="200"></canvas>
    </div>

    <div class="controls">
      <button id="startBtn" class="btn">ゲーム開始</button>
      <button id="rollBtn" class="btn">ルーレットを回す</button>
      <button id="resetBtn" class="btn">リセット</button>
    </div>

    <div id="status"></div>
    <div id="players"></div>
  </div>

  <div id="board"></div>

  <div id="result"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/client.js"></script>
</body>
</html>
